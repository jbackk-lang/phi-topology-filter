<svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#fafafa"/>
  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">phi-topology-filter — architektura po refaktorze (2026-09-05)</text>

  <!-- Input -->
  <rect x="30" y="80" width="180" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" fill="#0c4a6e" font-weight="600">Obraz RGB</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#0c4a6e">jpg / png / webp / bmp</text>

  <rect x="30" y="160" width="180" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="185" text-anchor="middle" font-size="13" fill="#0c4a6e" font-weight="600">Dane FITS</text>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#0c4a6e">NASA / JWST / HST</text>

  <!-- phi_core -->
  <rect x="290" y="70" width="320" height="220" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">phi_core.py — wspólny rdzeń</text>
  <text x="450" y="110" text-anchor="middle" font-size="10.5" fill="#854d0e">(jedyne miejsce z tą matematyką)</text>

  <rect x="308" y="122" width="284" height="30" rx="5" fill="#fffbeb" stroke="#d4a72c"/>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#713f12">gradient_field(gray) → mag, nx, ny</text>

  <rect x="308" y="162" width="88" height="34" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="352" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">Λ</text>
  <text x="352" y="190" text-anchor="middle" font-size="9" fill="#7f1d1d">coherence_lambda</text>

  <rect x="404" y="162" width="88" height="34" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="448" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">τ</text>
  <text x="448" y="190" text-anchor="middle" font-size="9" fill="#1e3a8a">flow_tau</text>

  <rect x="500" y="162" width="92" height="34" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="546" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d"></text>
  <text x="546" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">ρ</text>
  <text x="546" y="190" text-anchor="middle" font-size="9" fill="#14532d">defects_rho</text>

  <rect x="308" y="210" width="284" height="34" rx="5" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="450" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#581c87">phi_composite = Λ + τ − ρ (normalize)</text>

  <text x="450" y="266" text-anchor="middle" font-size="10" fill="#78716c">BUGFIX 2026-09-05: Λ liczona wcześniej 3× niezależnie</text>
  <text x="450" y="280" text-anchor="middle" font-size="10" fill="#78716c">(phi_filter_v2 / phi_fits / phi_map) — teraz jeden import</text>

  <!-- API layer -->
  <rect x="670" y="55" width="200" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="770" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">phi_filter_v2.py</text>
  <text x="770" y="95" text-anchor="middle" font-size="10.5" fill="#065f46">mode: phi / lambda / tau / rho</text>

  <rect x="670" y="130" width="200" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="770" y="153" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">phi_fits.py</text>
  <text x="770" y="170" text-anchor="middle" font-size="10.5" fill="#065f46">mode: phi / lambda / tau / rho</text>

  <rect x="670" y="205" width="200" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="770" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">phi_map.py</text>
  <text x="770" y="245" text-anchor="middle" font-size="10.5" fill="#065f46">zwraca (Λ, τ, ρ) osobno</text>

  <!-- phi_batch -->
  <rect x="700" y="300" width="170" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="785" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">phi_batch.py</text>
  <text x="785" y="342" text-anchor="middle" font-size="10.5" fill="#7c2d12">process_directory()</text>

  <text x="785" y="378" text-anchor="middle" font-size="9.5" fill="#78716c">BUGFIX: mode był</text>
  <text x="785" y="391" text-anchor="middle" font-size="9.5" fill="#78716c">ignorowany dla RGB</text>

  <!-- run.bat -->
  <rect x="700" y="420" width="170" height="52" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="785" y="443" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">run.bat</text>
  <text x="785" y="460" text-anchor="middle" font-size="10" fill="#312e81">install → test → uruchom</text>

  <!-- Output -->
  <rect x="930" y="150" width="130" height="150" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="995" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">output/</text>
  <text x="995" y="205" text-anchor="middle" font-size="10" fill="#4c1d95">*_phi.jpg</text>
  <text x="995" y="222" text-anchor="middle" font-size="10" fill="#4c1d95">*_lambda.jpg</text>
  <text x="995" y="239" text-anchor="middle" font-size="10" fill="#4c1d95">*_tau.jpg</text>
  <text x="995" y="256" text-anchor="middle" font-size="10" fill="#4c1d95">*_rho.jpg</text>
  <text x="995" y="278" text-anchor="middle" font-size="9" fill="#6d28d9">(teraz naprawdę</text>
  <text x="995" y="291" text-anchor="middle" font-size="9" fill="#6d28d9">osobne mapy)</text>

  <!-- test file -->
  <rect x="290" y="330" width="320" height="46" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="358" text-anchor="middle" font-size="12" fill="#374151">test_phi.py — 7 testów sanity (nowe)</text>

  <!-- Arrows -->
  <path d="M210,110 L290,140" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M210,190 L290,190" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M610,145 C640,110 640,90 668,85" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M610,180 L668,165" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M610,220 C640,240 640,240 668,236" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M770,113 L780,300" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#arrow)" fill="none" stroke-dasharray="3 3"/>
  <path d="M770,188 L783,300" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#arrow)" fill="none" stroke-dasharray="3 3"/>

  <path d="M785,360 L785,420" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M870,90 L930,190" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M870,165 L930,220" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M870,240 L930,250" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M870,340 L930,290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Legend -->
  <rect x="30" y="560" width="1020" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="46" y="580" font-size="11" fill="#374151" font-weight="600">Legenda:</text>
  <text x="46" y="598" font-size="10.5" fill="#4b5563">ciągła strzałka = wywołanie funkcji · przerywana szara = "ten sam moduł steruje" · przerywany fiolet = brakujące dotąd testy (uzupełnione)</text>
  <text x="46" y="612" font-size="10.5" fill="#4b5563">Wszystkie trzy zielone bloki (phi_filter_v2 / phi_fits / phi_map) importują Λ z jednego miejsca (żółty blok) — koniec rozjazdu z 2026-09-04.</text>
